name: CI

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Validate location configs
        run: npm run validate-config

      - name: Build (GitHub Pages base)
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - name: Build (Cloudflare Pages base)
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare
