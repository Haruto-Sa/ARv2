<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>水門 AR（config 駆動 / LocAR）</title>
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* 背景は透明にする。不透明だと z-index:-1 のカメラ映像(LocAR)を覆い隠す。
           紹介ページ #intro は自前の背景を持つので見た目は変わらない。 */
        background: transparent;
        font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
      }

      /* ===== 紹介ページ（イントロ） ===== */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
        color: #eaf2ff;
        background: radial-gradient(120% 90% at 50% 0%, #12365e 0%, #06121f 60%);
      }
      #intro .icon { font-size: 56px; line-height: 1; }
      #intro h1 { margin: 0; font-size: 24px; letter-spacing: 0.04em; }
      #intro p { margin: 0; max-width: 30em; font-size: 14px; line-height: 1.7; color: #b8c9e0; }
      #intro ul {
        margin: 4px 0 0; padding: 0; list-style: none;
        font-size: 13px; color: #93a7c4; line-height: 1.9;
      }
      #start-ar {
        margin-top: 8px; padding: 15px 40px; font-size: 17px; font-weight: 700;
        color: #06121f; background: linear-gradient(180deg, #6fd0ff, #3a9bff);
        border: 0; border-radius: 999px; box-shadow: 0 6px 20px rgba(58, 155, 255, 0.4);
        cursor: pointer;
      }
      #start-ar:active { transform: translateY(1px); }
      #intro .note { font-size: 12px; color: #6f86a6; }
      #intro .warn { font-size: 12.5px; color: #ffd27a; max-width: 30em; }
      #starting { font-size: 13px; color: #9cf; }
    </style>
  </head>
  <body>
    <!--
      紹介ページのみ。AR のカメラ/レンダラ(canvas)・モデルは src/main.js が
      「ARを開始」タップ後に生成する（モバイルのカメラ/方位許可はユーザー操作が必要なため）。
      LocAR が <video> と <canvas> を body に差し込む。
    -->
    <main id="intro">
      <div class="icon">🌊</div>
      <h1>水門 AR ビューア</h1>
      <p>
        指定した地点に水門の3Dモデルを実物大で重ねて表示します。
        スマートフォンを構えて見渡すと、現実の風景の中に水門が固定表示されます。
      </p>
      <ul>
        <li>📍 位置情報と方位センサーを使用します</li>
        <li>📷 開始するとカメラが起動します</li>
        <li>🧭 屋外で、空が見える場所での利用を推奨します</li>
      </ul>
      <button id="start-ar" type="button">ARを開始</button>
      <p class="warn" id="intro-warn" hidden></p>
      <p class="note">
        開始後に「カメラ」「位置情報」「モーションと画面の向き」の許可を求められたら許可してください。
      </p>
      <p id="starting" hidden>カメラを起動しています…</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
