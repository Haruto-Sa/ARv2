name: CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Validate location configs
        run: npm run validate-config

      - name: Build (GitHub Pages base)
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - name: Verify deployed placement files
        run: npm run verify-placement -- --dir dist --expect production

      - name: Assert /lab is excluded from the production build
        run: scripts/assert-no-lab.sh

      - name: Build (Cloudflare Pages base)
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare

      - name: Verify deployed placement files
        run: npm run verify-placement -- --dir dist --expect production

      - name: Assert /lab is excluded from the production build
        run: scripts/assert-no-lab.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
